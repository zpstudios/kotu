# push·PR마다 GitHub의 Windows 러너에서 전체 빌드 + 단위 테스트를 실행한다.
# 맥에서 개발해도 매 커밋이 Windows에서 실제로 컴파일되는지 자동 검증된다.
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 구조 정합성 검사
        shell: pwsh
        run: ./eng/Test-Architecture.ps1

      - name: .NET 8 SDK 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: NuGet 복원
        run: dotnet restore KOTU.sln -p:Platform=x64

      - name: 빌드 (Release, x64)
        run: dotnet build KOTU.sln -c Release -p:Platform=x64 --no-restore

      - name: 단위 테스트
        run: dotnet test KOTU.sln -c Release -p:Platform=x64 --no-build --verbosity normal --logger trx --results-directory TestResults

      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: 작업 브랜치 실행본 생성
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        run: dotnet publish src/KOTU.App -c Release -p:Platform=x64 -r win-x64 --self-contained -o artifacts/KOTU -p:InformationalVersion=${{ github.sha }}

      - name: 실행본 엔진 및 리소스 정합성 검사
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        shell: pwsh
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          $package = Join-Path $PWD 'artifacts/KOTU'
          $sevenZip = 'C:/Program Files/7-Zip/7z.dll'
          if (!(Test-Path $sevenZip)) { throw '7z.dll missing from Windows runner' }
          Copy-Item $sevenZip $package
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md $package
          $required = @('KOTU.exe', 'resources.pri', '7z.dll',
                        'KOTU.DocumentModel.dll', 'KOTU.FileOperations.dll',
                        'Assets/app.ico', 'Assets/test-clip.mp4', 'Assets/sample.mp3')
          foreach ($file in $required) {
            if (!(Test-Path (Join-Path $package $file))) { throw "Package missing: $file" }
          }
          $vlc = Get-ChildItem $package -Recurse -Filter libvlc.dll | Select-Object -First 1
          if (!$vlc -or !(Test-Path (Join-Path $vlc.DirectoryName 'libvlccore.dll')) -or
              !(Test-Path (Join-Path $vlc.DirectoryName 'plugins'))) { throw 'VLC engine or plugins missing' }
          @"
          KOTU branch build
          Branch: $env:BUILD_BRANCH
          Commit: $env:BUILD_COMMIT

          Extract the entire ZIP, close all running KOTU instances, then launch KOTU.exe.
          This is a branch test build, not an official release.
          The separate KOTU-installer artifact contains Setup.exe, which replaces the existing KOTU installation.
          Installed builds still use the official release update feed, not this branch.
          It uses the existing KOTU user settings and file associations; back up settings before testing.
          See docs/ARCHITECTURE-MIGRATION.md in the repository for the manual checks.
          "@ | Set-Content (Join-Path $package 'BRANCH-BUILD.txt') -Encoding utf8

      - name: 실행본 시작 검사
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'artifacts/KOTU'
          $app = Start-Process -FilePath (Join-Path $package 'KOTU.exe') -WorkingDirectory $package -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited) { throw "KOTU exited during startup: $($app.ExitCode)" }
            $startupLog = Join-Path $env:TEMP 'KOTU/startup-error.log'
            if (Test-Path $startupLog) { throw (Get-Content $startupLog -Raw) }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: 작업 브랜치 실행본 다운로드
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: KOTU-win-x64-${{ github.sha }}
          path: artifacts/KOTU/
          if-no-files-found: error
          retention-days: 14

      - name: 작업 브랜치 설치 EXE 생성
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Velopack installation failed' }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version |
                     Where-Object { $_ } | Select-Object -First 1
          if (!$version) { throw 'Package version missing' }
          vpk pack --packId KOTU --packVersion $version `
                   --packDir artifacts/KOTU --mainExe KOTU.exe `
                   --packTitle KOTU --packAuthors "ZP Studios" --outputDir artifacts/installer `
                   --splashImage packaging/splash.png --icon src/KOTU.App/Assets/app.ico
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed' }
          if (!(Test-Path artifacts/installer/KOTU-win-Setup.exe)) { throw 'Setup.exe missing' }

      - name: 설치 및 설치본 정합성 검사
        timeout-minutes: 5
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          $setup = (Resolve-Path artifacts/installer/KOTU-win-Setup.exe).Path
          $installer = Start-Process -FilePath $setup -ArgumentList '--silent' -WindowStyle Hidden -PassThru
          if (!$installer.WaitForExit(120000)) {
            Stop-Process -Id $installer.Id -Force
            throw 'Installer timed out'
          }
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'KOTU/current'
          $package = (Resolve-Path artifacts/KOTU).Path
          foreach ($file in (Get-ChildItem $package -Recurse -File)) {
            # Velopack 1.2.0 PackageBuilder.REGEX_EXCLUDES + PackCommand.Exclude 기본값.
            # 진단 파일만 제외하며 실행 파일·DLL·리소스의 누락/변경은 계속 실패시킨다.
            if ($file.FullName -imatch '.*[\\/]createdump.*|.*\.vshost\..*|.*\.nupkg$' -or
                $file.FullName -cmatch '.*\.pdb') { continue }
            $relative = [IO.Path]::GetRelativePath($package, $file.FullName)
            $target = Join-Path $installed $relative
            if (!(Test-Path $target)) { throw "Installed file missing: $relative" }
            if ((Get-FileHash $file.FullName).Hash -ne (Get-FileHash $target).Hash) {
              throw "Installed file differs: $relative"
            }
          }
          $app = Start-Process -FilePath (Join-Path $installed 'KOTU.exe') -WorkingDirectory $installed -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 10
            $app.Refresh()
            if ($app.HasExited) { throw "Installed KOTU exited: $($app.ExitCode)" }
            $startupLog = Join-Path $env:TEMP 'KOTU/startup-error.log'
            if (Test-Path $startupLog) { throw (Get-Content $startupLog -Raw) }
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: 작업 브랜치 설치 EXE 다운로드
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: KOTU-installer-win-x64-${{ github.sha }}
          path: artifacts/installer/KOTU-win-Setup.exe
          if-no-files-found: error
          retention-days: 14
