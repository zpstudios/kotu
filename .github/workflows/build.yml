# push·PR마다 GitHub의 Windows 러너에서 전체 빌드 + 단위 테스트를 실행한다.
# 맥에서 개발해도 매 커밋이 Windows에서 실제로 컴파일되는지 자동 검증된다.
name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Validate fixed Git evidence links, including historical line ranges.

      - name: Documentation lifecycle
        shell: pwsh
        run: ./eng/Test-Documentation.ps1

      - name: Documentation checker regression
        shell: pwsh
        run: ./eng/Test-Documentation.Tests.ps1

      - name: Release notes validation
        shell: pwsh
        run: ./eng/Test-ReleaseNotes.ps1

      - name: 구조 정합성 검사
        shell: pwsh
        run: |
          ./eng/Test-Architecture.ps1
          ./eng/Test-ReleaseWorkflow.ps1

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Editor protocol tests
        shell: pwsh
        run: node src/KOTU.Module.Document/EditorSource/protocol.test.mjs

      - name: Editor visual tests
        shell: pwsh
        run: node src/KOTU.Module.Document/EditorSource/visual.test.mjs

      - name: HWP page rendering on real documents
        run: node eng/Test-HwpRenderer.mjs

      - name: .NET 8 SDK 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build patched recording engine
        shell: pwsh
        run: |
          ./eng/Test-RecordingEngineContract.ps1
          ./eng/Build-RecordingEngine.ps1

      - name: NuGet 복원
        run: dotnet restore KOTU.sln -p:Platform=x64

      - name: 빌드 (Release, x64)
        run: dotnet build KOTU.sln -c Release -p:Platform=x64 --no-restore

      - name: 단위 테스트
        run: dotnet test KOTU.sln -c Release -p:Platform=x64 --no-build --verbosity normal --logger trx --results-directory TestResults

      - name: Explorer 선택 COM 전달 검사
        timeout-minutes: 3
        run: dotnet run --project eng/ShellVerbSmoke/ShellVerbSmoke.csproj -c Release

      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: 작업 브랜치 실행본 생성
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        run: dotnet publish src/KOTU.App -c Release -p:Platform=x64 -r win-x64 --self-contained -o artifacts/KOTU -p:KotuTestBuild=true -p:InformationalVersion=${{ github.sha }}

      - name: 실행본 엔진 및 리소스 정합성 검사
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        shell: pwsh
        env:
          BUILD_BRANCH: ${{ github.ref_name }}
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          ./eng/Prepare-Package.ps1 -PackagePath artifacts/KOTU
          $package = Join-Path $PWD 'artifacts/KOTU'
          @"
          KOTU branch build
          Branch: $env:BUILD_BRANCH
          Commit: $env:BUILD_COMMIT

          Extract the entire ZIP and launch KOTU.exe to run KOTU Test.
          To install KOTU Test alongside KOTU, use KOTU.Test-win-Setup.exe from the installer artifact.
          Both test builds use %APPDATA%\KOTU.Test for settings. Close KOTU Test before switching between them.
          Install a newer test build manually. The KOTU app receives official release updates.
          See docs/ARCHITECTURE-MIGRATION.md in the repository for the manual checks.
          "@ | Set-Content (Join-Path $package 'BRANCH-BUILD.txt') -Encoding utf8

      - name: 실행본 시작 검사
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          ./eng/Test-AppStartup.ps1 -PackagePath artifacts/KOTU -PackageId KOTU.Test

      - name: 작업 브랜치 실행본 다운로드
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: KOTU-win-x64-${{ github.sha }}
          path: artifacts/KOTU/
          if-no-files-found: error
          retention-days: 14

      - name: 작업 브랜치 설치 EXE 생성
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Velopack installation failed' }
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version |
                     Where-Object { $_ } | Select-Object -First 1
          if (!$version) { throw 'Package version missing' }
          vpk pack --packId KOTU.Test --packVersion $version `
                   --packDir artifacts/KOTU --mainExe KOTU.exe `
                   --packTitle "KOTU Test" --packAuthors "ZP Studios" --outputDir artifacts/installer `
                   --splashImage packaging/splash.png --icon src/KOTU.App/Assets/app.ico
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed' }
          ./eng/Test-ReleasePackage.ps1 -PackagePath artifacts/installer -Version $version -PackageId KOTU.Test

      - name: 정식 Setup 다운로드 (병행 설치 검증용)
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo zpstudios/kotu --pattern KOTU-win-Setup.exe --dir artifacts/stable-baseline

      - name: 설치 및 설치본 정합성 검사
        timeout-minutes: 10
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          ./eng/Test-Installer.ps1 -SetupPath artifacts/installer/KOTU.Test-win-Setup.exe -PackagePath artifacts/KOTU -PackageId KOTU.Test -StableSetupPath artifacts/stable-baseline/KOTU-win-Setup.exe

      - name: 작업 브랜치 설치 EXE 다운로드
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: KOTU-installer-win-x64-${{ github.sha }}
          path: artifacts/installer/KOTU.Test-win-Setup.exe
          if-no-files-found: error
          retention-days: 14
