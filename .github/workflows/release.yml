# 완전 자동 릴리스: master에 push되면 Directory.Build.props의 <Version>을 읽어
# 해당 버전 태그(v0.6.1 등)가 아직 없으면 빌드→zip→태그 생성→Release 업로드까지 수행한다.
# 커밋마다 버전을 올리는 저장소 규칙과 결합되어, push만 하면 릴리스가 나온다.
# 같은 버전을 다시 push하면(태그 이미 존재) 조용히 건너뛴다(멱등).
name: release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write   # 태그·Release 생성 권한

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 태그 존재 확인용

      - name: 버전 읽기 + 릴리스 필요 여부 판단
        id: ver
        shell: pwsh
        run: |
          $ver = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version |
                 Where-Object { $_ } | Select-Object -First 1
          if (-not $ver) { Write-Error "Directory.Build.props에서 Version을 못 읽음"; exit 1 }
          $tag = "v$ver"
          $exists = (git tag -l $tag)
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "skip=$(if ($exists) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "version=$ver, tag=$tag, 이미 릴리스됨=$([bool]$exists)"

      - name: .NET 8 SDK 설치
        if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, x64)
        if: steps.ver.outputs.skip != 'true'
        run: dotnet publish src/WinUtil.App -c Release -p:Platform=x64 -r win-x64 --self-contained

      - name: 7z.dll 동봉 (LGPL — 원본 그대로, 고지 파일 포함, 동적 로드만)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          # windows 러너에는 7-Zip이 기본 설치되어 있다. 없으면 choco로 설치.
          if (!(Test-Path "C:\Program Files\7-Zip\7z.dll")) { choco install 7zip -y --no-progress }
          $publishDir = Get-ChildItem -Path src/WinUtil.App/bin -Recurse -Directory -Filter publish | Select-Object -First 1
          Copy-Item "C:\Program Files\7-Zip\7z.dll" $publishDir.FullName
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md $publishDir.FullName

      - name: resources.pri 검증 (없으면 실행 불가 zip이므로 릴리스 중단)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $publishDir = (Get-ChildItem -Path src/WinUtil.App/bin -Recurse -Directory -Filter publish | Select-Object -First 1).FullName
          # 혹시 publish 복사가 또 빠지면 빌드 출력(OutDir)에서 가져온다.
          if (!(Test-Path "$publishDir\resources.pri")) {
            $outPri = Get-ChildItem src/WinUtil.App/bin -Recurse -Filter resources.pri |
                      Where-Object { $_.FullName -notlike "*publish*" } | Select-Object -First 1
            if ($outPri) { Copy-Item $outPri.FullName $publishDir }
          }
          # 기본 이름(WinUtil.App.pri)으로 생성된 경우: 로더가 찾는 고정 이름으로 복사
          if (!(Test-Path "$publishDir\resources.pri") -and (Test-Path "$publishDir\WinUtil.App.pri")) {
            Copy-Item "$publishDir\WinUtil.App.pri" "$publishDir\resources.pri"
          }
          if (!(Test-Path "$publishDir\resources.pri")) {
            Write-Host "### resources.pri가 어디에도 없음 — bin 전체의 pri 목록:"
            Get-ChildItem src/WinUtil.App/bin -Recurse -Filter *.pri | ForEach-Object { Write-Host $_.FullName }
            Write-Error "resources.pri 미생성 — EnableMsixTooling/PRI 설정을 확인할 것. 실행 불가 zip이므로 릴리스를 중단한다."
            exit 1
          }
          Write-Host "resources.pri OK: $publishDir\resources.pri"

      - name: zip 패키징 (수동 포터블 — 호환 유지)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $publishDir = Get-ChildItem -Path src/WinUtil.App/bin -Recurse -Directory -Filter publish | Select-Object -First 1
          Compress-Archive -Path "$($publishDir.FullName)\*" -DestinationPath "WinUtil-${{ steps.ver.outputs.tag }}-win-x64.zip"

      - name: Velopack 패키징 (Setup.exe + 자동 업데이트 피드)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          $publishDir = (Get-ChildItem -Path src/WinUtil.App/bin -Recurse -Directory -Filter publish | Select-Object -First 1).FullName
          vpk pack --packId WinUtil --packVersion ${{ steps.ver.outputs.version }} `
                   --packDir $publishDir --mainExe WinUtil.App.exe `
                   --packTitle WinUtil --packAuthors tsusaikang --outputDir vpk_out
          if ($LASTEXITCODE -ne 0) { Write-Error "vpk pack 실패"; exit 1 }
          Get-ChildItem vpk_out | ForEach-Object { Write-Host ("생성됨: " + $_.Name) }

      - name: 태그 생성 + GitHub Release 업로드
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            WinUtil-${{ steps.ver.outputs.tag }}-win-x64.zip
            vpk_out/*
          body: |
            **권장: `WinUtil-win-Setup.exe`** — 설치 한 번이면 이후 새 버전이 나올 때 앱이 알아서 업데이트합니다.
            `WinUtil-*-win-x64.zip`은 수동 포터블(자동 업데이트 없음)입니다. 어느 쪽이든 압축·이미지·동영상 기능이 바로 동작합니다.
            7z.dll(LGPL)과 libvlc(LGPL) 동봉 — 고지는 THIRD-PARTY-NOTICES.md 참고.
