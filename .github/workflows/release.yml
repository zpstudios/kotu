# 완전 자동 릴리스: master에 push되면 Directory.Build.props의 <Version>을 읽어
# 해당 버전 태그(v0.6.1 등)가 아직 없으면 빌드→zip→태그 생성→Release 업로드까지 수행한다.
# 커밋마다 버전을 올리는 저장소 규칙과 결합되어, push만 하면 릴리스가 나온다.
# 같은 버전을 다시 push하면(태그 이미 존재) 조용히 건너뛴다(멱등).
# ※ A210: 이 멱등 판정은 "체크아웃 시점의 태그"를 보는데, 태그는 런의 마지막 단계에서야 생긴다.
#   즉 앞 런이 태그를 달기 전에 뒤 런이 체크아웃하면 skip=false가 되어 같은 버전을 다시
#   빌드·패키징하고 기존 릴리스에 동명 자산을 재업로드하다 실패한다(1차 런은 이미 정상 발행됨).
#   "커밋마다 push"(협업 규칙 1.3) 운용에서는 버전 커밋 직후의 docs 커밋 push가 이 갈래를
#   상시로 만든다. 그래서 아래 concurrency로 릴리스 런을 직렬화한다 — 뒤 런은 앞 런이 끝난 뒤에
#   체크아웃하므로 태그 검사가 경합 없이 성립하고, 같은 버전이면 skip 초록으로 떨어진다.
# A358: 검증·설치 검사 성공 뒤에만 master에서 발행한다. 다른 ref의 수동 실행은 아티팩트만 남긴다.
name: release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write   # 태그·Release 생성 권한

# A210: 릴리스 런을 저장소 전역으로 한 줄에 세운다(위 헤더 주석 참고).
# group은 반드시 고정 문자열 — ref 표현식을 넣으면 브랜치별 그룹이 되어 직렬화가 깨진다.
# cancel-in-progress는 반드시 false — true면 진행 중인 릴리스 빌드가 취소되어 그 버전이 누락된다.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 태그 존재 확인용

      - name: 버전 읽기 + 릴리스 필요 여부 판단
        id: ver
        shell: pwsh
        run: |
          $ver = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version |
                 Where-Object { $_ } | Select-Object -First 1
          if (-not $ver) { Write-Error "Directory.Build.props에서 Version을 못 읽음"; exit 1 }
          $tag = "v$ver"
          $exists = (git tag -l $tag)
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "skip=$(if ($exists -and $env:GITHUB_REF -eq 'refs/heads/master') { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "version=$ver, tag=$tag, 이미 릴리스됨=$([bool]$exists)"

      - name: .NET 8 SDK 설치
        if: steps.ver.outputs.skip != 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 구조 및 배포 게이트 검사
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          ./eng/Test-Architecture.ps1
          ./eng/Test-ReleaseWorkflow.ps1

      - name: NuGet 복원
        if: steps.ver.outputs.skip != 'true'
        run: dotnet restore KOTU.sln -p:Platform=x64

      - name: 전체 솔루션 빌드
        if: steps.ver.outputs.skip != 'true'
        run: dotnet build KOTU.sln -c Release -p:Platform=x64 --no-restore

      - name: 전체 솔루션 테스트
        if: steps.ver.outputs.skip != 'true'
        run: dotnet test KOTU.sln -c Release -p:Platform=x64 --no-build --verbosity normal --logger trx --results-directory TestResults

      - name: 테스트 결과 보관
        if: always() && steps.ver.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Publish (self-contained, x64)
        if: steps.ver.outputs.skip != 'true'
        run: dotnet publish src/KOTU.App -c Release -p:Platform=x64 -r win-x64 --self-contained -o artifacts/KOTU -p:InformationalVersion=${{ github.sha }}

      - name: 실행본 정합성 및 시작 검사
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          ./eng/Prepare-Package.ps1 -PackagePath artifacts/KOTU
          ./eng/Test-AppStartup.ps1 -PackagePath artifacts/KOTU

      # A173: vpk pack은 출력 폴더에 직전 릴리스의 풀 패키지가 있어야 델타(*-delta.nupkg)를 만든다.
      # 그래서 pack 전에 GitHub Releases에서 최신 풀 패키지를 내려받아 둔다(프라이빗 저장소이므로 토큰 필수).
      # 이 단계가 실패하면 릴리스는 계속하되 "델타 없이 풀 패키지만" 나간다 — 조용한 후퇴이므로
      # 첫 도입·직전 릴리스 부재가 아닌데도 델타가 안 나오면 이 단계 로그부터 볼 것.
      - name: 직전 릴리스 취득 (델타 생성용, A173)
        if: steps.ver.outputs.skip != 'true' && github.ref == 'refs/heads/master'
        # 최후 방어선: 아래 스크립트가 예기치 못한 예외로 죽어도 릴리스 자체는 진행한다(델타만 포기).
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # permissions.contents=write 에 릴리스 자산 읽기가 포함된다
        run: |
          dotnet tool install --global vpk --version 1.2.0
          if (-not (Get-Command vpk -ErrorAction SilentlyContinue)) {
            Write-Warning "vpk 설치 실패 — 델타 없이 계속한다(패키징 단계에서 설치를 재시도)."
            exit 0
          }
          # 채널(win)을 유지하고 성공한 풀 패키지만 pack 출력 폴더로 복사한다.
          vpk download github --repoUrl https://github.com/zpstudios/kotu --token $env:GH_TOKEN --outputDir vpk_base
          if ($LASTEXITCODE -ne 0) {
            # 릴리스가 하나도 없거나(첫 릴리스) 자산에 releases.win.json이 없으면 여기로 온다.
            # 불완전한 다운로드를 pack의 델타 베이스로 사용하지 않는다.
            Write-Warning "직전 릴리스 취득 실패 — 이번 릴리스는 델타 없이 풀 패키지만 발행된다."
            # 실패한 다운로드는 별도 폴더에 남긴다. pack 입력에는 복사하지 않는다.
            exit 0
          }
          New-Item -ItemType Directory -Path vpk_out -Force | Out-Null
          Get-ChildItem vpk_base -File -Filter '*-full.nupkg' | Copy-Item -Destination vpk_out

      - name: Velopack 패키징 (Setup.exe + 자동 업데이트 피드)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          # A173: 직전 릴리스 취득 단계가 이미 설치했을 수 있다 — 중복 설치는 실패하므로 있으면 건너뛴다.
          if (-not (Get-Command vpk -ErrorAction SilentlyContinue)) {
            dotnet tool install --global vpk --version 1.2.0
          }
          $publishDir = (Resolve-Path -LiteralPath artifacts/KOTU).Path
          # mainExe는 KOTU.exe — A64(v0.88.0)에서 AssemblyName을 KOTU로 바꿨다(구: WinUtil.App.exe).
          # packId = KOTU (A46/v0.86.0 리브랜딩). packId가 바뀌면 구 packId(ZP·WinUtil) 설치본은
          # 자동 업데이트가 끊기므로 새 KOTU-win-Setup.exe를 1회 수동 설치해야 한다 (릴리스 본문에 안내).
          # 스플래시(미션 스테이트먼트) + Setup/Update 다이얼로그 아이콘
          vpk pack --packId KOTU --packVersion ${{ steps.ver.outputs.version }} `
                   --packDir $publishDir --mainExe KOTU.exe `
                   --packTitle KOTU --packAuthors "ZP Studios" --outputDir vpk_out `
                   --splashImage packaging/splash.png --icon src/KOTU.App/Assets/app.ico
          if ($LASTEXITCODE -ne 0) { Write-Error "vpk pack 실패"; exit 1 }
          # A173: 델타 베이스로 쓴 "직전 버전" 패키지는 업로드 대상에서 제거한다 — 남기면
          # files: vpk_out/* 가 구 버전 nupkg(약 100MB)를 새 릴리스에 또 첨부한다.
          # 업데이터는 각 자산을 "그 자산이 든 릴리스"에서 받으므로 여기서 지워도 무해하다.
          $ver = "${{ steps.ver.outputs.version }}"
          Get-ChildItem vpk_out -Filter *.nupkg |
            Where-Object { $_.Name -notlike "*$ver*" } |
            ForEach-Object { Write-Host ("업로드 제외(직전 버전): " + $_.Name); Remove-Item -LiteralPath $_.FullName -Force }
          Get-ChildItem vpk_out | ForEach-Object { Write-Host ("생성됨: " + $_.Name) }

      - name: 설치 및 설치본 정합성 검사
        timeout-minutes: 5
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          ./eng/Test-ReleasePackage.ps1 -PackagePath vpk_out -Version '${{ steps.ver.outputs.version }}'
          ./eng/Test-Installer.ps1 -SetupPath vpk_out/KOTU-win-Setup.exe -PackagePath artifacts/KOTU

      - name: 수동 시험 배포물 보관
        if: success() && steps.ver.outputs.skip != 'true' && github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: KOTU-release-dry-run-${{ github.sha }}
          path: vpk_out/*
          if-no-files-found: error
          retention-days: 14

      - name: 태그 생성 + GitHub Release 업로드
        if: success() && steps.ver.outputs.skip != 'true' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: vpk_out/*
          body: |
            ## 앱 이름이 **KOTU (King Of The Util)** 로 바뀌었습니다 (v0.86.0, A46)

            ## 받을 파일은 둘 중 하나입니다
            - **`KOTU-win-Setup.exe`** — 설치판. 시작 메뉴 등록, 이후 자동 업데이트.
            - **`KOTU-win-Portable.zip`** — 무설치판. 아무 폴더에나 풀어 실행, 역시 자동 업데이트.

            > **구 `ZP`(v0.85.0 이하) 또는 `WinUtil`(v0.32.0 이하) 설치본을 쓰고 있다면** 자동 업데이트가
            > 여기서 끊깁니다 — 새 `KOTU-win-Setup.exe`를 한 번 설치해 주세요.
            > 이번에는 **설정·이어보기 기록이 이관되지 않습니다**(사용자 결정) — 기본값으로 시작하고,
            > 파일 연결·우클릭 메뉴는 설정 화면에서 다시 켜 주세요. 구 ZP 등록 흔적은 첫 실행에서 자동 청소됩니다.
            > 구 설정이 필요하면 `%AppData%\ZP\settings.json`에 그대로 남아 있습니다.

            > **v0.88.0**: 실행 파일 이름이 `WinUtil.App.exe` → **`KOTU.exe`** 로 바뀌었습니다(A64).
            > 관리자 권한 재실행(UAC) 대화상자에도 이제 `KOTU.exe`로 표시됩니다.
            > 자동 업데이트로 올라오면 바로가기는 새 exe로 갱신되지만, **구 exe를 직접 가리키던
            > 작업표시줄 고정·바로가기는 다시 만들어 주세요.**

            둘 다 압축·이미지·동영상 엔진(7z.dll·libvlc, 각 LGPL — THIRD-PARTY-NOTICES.md 참고)이 동봉되어 바로 동작합니다.
            _그 외 파일(`*.nupkg` — 델타 `*-delta.nupkg` 포함, `*.json`, `RELEASES`)은 자동 업데이트 시스템이 읽는 내부 파일입니다 — 받지 마세요._
