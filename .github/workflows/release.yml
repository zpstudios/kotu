# "v0.5.0" 같은 태그를 push하면 Release 빌드를 만들어
# zip으로 묶어 GitHub Releases에 자동 업로드한다.
#   git tag v0.5.0 && git push origin v0.5.0
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # Release 생성 권한

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8 SDK 설치
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, x64)
        run: dotnet publish src/WinUtil.App -c Release -p:Platform=x64 -r win-x64 --self-contained

      - name: 7z.dll 동봉 (LGPL — 원본 그대로, 고지 파일 포함, 동적 로드만)
        shell: pwsh
        run: |
          # windows 러너에는 7-Zip이 기본 설치되어 있다. 없으면 choco로 설치.
          if (!(Test-Path "C:\Program Files\7-Zip\7z.dll")) { choco install 7zip -y --no-progress }
          $publishDir = Get-ChildItem -Path src/WinUtil.App/bin -Recurse -Directory -Filter publish | Select-Object -First 1
          Copy-Item "C:\Program Files\7-Zip\7z.dll" $publishDir.FullName
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md $publishDir.FullName

      - name: resources.pri 검증 (없으면 실행 불가 zip이므로 릴리스 중단)
        shell: pwsh
        run: |
          $publishDir = (Get-ChildItem -Path src/WinUtil.App/bin -Recurse -Directory -Filter publish | Select-Object -First 1).FullName
          # 혹시 publish 복사가 또 빠지면 빌드 출력(OutDir)에서 가져온다.
          if (!(Test-Path "$publishDir\resources.pri")) {
            $outPri = Get-ChildItem src/WinUtil.App/bin -Recurse -Filter resources.pri |
                      Where-Object { $_.FullName -notlike "*publish*" } | Select-Object -First 1
            if ($outPri) { Copy-Item $outPri.FullName $publishDir }
          }
          if (!(Test-Path "$publishDir\resources.pri")) {
            Write-Host "### resources.pri가 어디에도 없음 — bin 전체의 pri 목록:"
            Get-ChildItem src/WinUtil.App/bin -Recurse -Filter *.pri | ForEach-Object { Write-Host $_.FullName }
            Write-Error "resources.pri 미생성 — EnableMsixTooling/PRI 설정을 확인할 것. 실행 불가 zip이므로 릴리스를 중단한다."
            exit 1
          }
          Write-Host "resources.pri OK: $publishDir\resources.pri"

      - name: zip 패키징
        shell: pwsh
        run: |
          $publishDir = Get-ChildItem -Path src/WinUtil.App/bin -Recurse -Directory -Filter publish | Select-Object -First 1
          Compress-Archive -Path "$($publishDir.FullName)\*" -DestinationPath "WinUtil-${{ github.ref_name }}-win-x64.zip"

      - name: GitHub Release 생성 및 업로드
        uses: softprops/action-gh-release@v2
        with:
          files: WinUtil-${{ github.ref_name }}-win-x64.zip
          body: |
            포터블 배포본 — 압축 풀고 `WinUtil.App.exe`를 실행하면 압축·이미지·동영상 기능이 바로 동작합니다 (별도 설치 불필요).
            7z.dll(LGPL)과 libvlc(LGPL)가 동봉되어 있으며 고지는 THIRD-PARTY-NOTICES.md 참고.
