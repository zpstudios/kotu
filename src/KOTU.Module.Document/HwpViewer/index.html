<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self'; img-src blob:; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HWP page preview</title>
  <style>
    :root { color-scheme: light dark; font: 14px 'Segoe UI', sans-serif; }
    body { margin: 0; }
    main { box-sizing: border-box; height: 100vh; padding: 9px; overflow: auto; background: #777; }
    #page { display: block; margin: 0 auto; outline: 1px solid #404040; background: white; }
    main[data-fit="Contain"] #page { max-width: 100%; max-height: 100%; }
    main[data-fit="FitWidth"] #page { width: 100%; height: auto; }
    main[data-fit="FitHeight"] #page { height: 100%; width: auto; }
    @media (forced-colors: active) {
      main { background: Canvas; }
      #page { outline-color: CanvasText; }
    }
    #page[hidden] { display: none; }
  </style>
  <script type="module" src="./viewer.js"></script>
</head>
<body>
  <main data-fit="Contain"><img id="page" alt="" hidden></main>
</body>
</html>
