<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; worker-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="editor.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}#editor-frame{position:absolute;inset:0}#editor{width:100%;height:100%;transform-origin:top left}#decor{position:absolute;inset:0;pointer-events:none}.decor-text{position:absolute;inset:0;pointer-events:none;transform-origin:top left}#decor-numbers{opacity:.4}#decor-marks{opacity:.25}
@media (forced-colors: none) {
  #editor .monaco-editor:is(.vs, .vs-dark) .cursor-line-style > .cursor {
    background-color: #39ff14;
    outline: 1px solid #000;
    /* Keep the left outline inside the text viewport at the first column. */
    translate: 1px 0;
  }
}
</style>
</head><body><div id="editor-frame"><div id="editor"></div></div><canvas id="decor" aria-hidden="true"></canvas><div id="decor-numbers" class="decor-text" aria-hidden="true"></div><div id="decor-marks" class="decor-text" aria-hidden="true"></div><script type="module" src="editor.js"></script></body></html>
